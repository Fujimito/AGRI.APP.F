<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2E7D4F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="防除記録" />
<title>農薬散布防除記録</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #F0F3EC; overflow-x: hidden; }
  .num { font-variant-numeric: tabular-nums; }
  input:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid #2E7D4F; outline-offset: 1px; }
  button { touch-action: manipulation; }
  /* スマホ向けリセット */
  input, select, textarea { font-size: 16px; } /* iOS自動ズーム防止 */
  @media (min-width: 768px) {
    /* タブレット・PC：地図を縦幅いっぱいに拡大 */
    [data-map-box] { height: calc(100dvh - 180px) !important; max-height: none !important; }
  }
  @media (min-width: 1024px) {
    /* デスクトップ：さらに大きく */
    [data-map-box] { height: calc(100dvh - 160px) !important; }
  }
  @media print {
    .no-print, nav { display: none !important; }
    body { background: #fff; }
    .print-only { display: block !important; }
  }
  .field-label { background: rgba(46,125,79,0.85); color:#fff; border:none; font-weight:700; font-size:12px; padding:2px 6px; box-shadow:none; }
  .field-label::before { display:none; }
  .pt-label { background:transparent; border:none; color:#fff; font-weight:800; box-shadow:none; text-shadow:0 1px 2px rgba(0,0,0,0.8); }
  .pt-label::before { display:none; }
  .vtx-icon { background:transparent; border:none; }
  .vtx { width:26px; height:26px; border-radius:50%; background:#C74E36; color:#fff; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
  .leaflet-container { font: inherit; }
</style>
<link rel="stylesheet" href="./leaflet.css" />
</head>
<body>
<div id="root"></div>
<script src="./react.production.min.js"></script>
<script src="./react-dom.production.min.js"></script>
<script src="./leaflet.js"></script>
<script src="./app.js"></script>
<script>
  // Service Worker登録(オフライン対応)
  if ("serviceWorker" in navigator) {
    // 初回インストールかどうか。初回は再読み込み不要なので区別しておく
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    // 新しいバージョンが有効になったら一度だけ再読み込みして最新画面に切り替える。
    // これが無いと、更新が反映されるまでアプリを2回開き直す必要があった。
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").then(function (reg) {
        reg.update();
        // ホーム画面アプリを前面に戻したときにも更新を確認する
        // (完全終了しないと更新されない、という状態を防ぐため)
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") reg.update();
        });
      }).catch(function (e) {
        console.error("SW登録失敗", e);
      });
    });
  }
</script>
</body>
</html>

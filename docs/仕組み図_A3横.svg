<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1587 1123" font-family="Noto Sans JP, Yu Gothic, Hiragino Sans, Meiryo, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0 0 L12 6 L0 12 z" fill="#3E5147"/>
  </marker>
  <marker id="arB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0 0 L12 6 L0 12 z" fill="#2A5F80"/>
  </marker>
</defs>

<rect width="1587" height="1123" fill="#FBFCFA"/>

<!-- 見出し -->
<rect x="45" y="34" width="1497" height="72" rx="10" fill="#2F6B45"/>
<text x="70" y="72" font-size="30" font-weight="800" fill="#FFFFFF">薬液調合ノート（農薬散布防除記録）</text>
<text x="70" y="97" font-size="17" fill="#CFE4D8">オフライン対応PWA ─ アプリの仕組み</text>
<text x="1517" y="68" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="end">v8.69</text>
<text x="1517" y="94" font-size="14" fill="#CFE4D8" text-anchor="end">2026-08 時点</text>

<!-- ROW1 -->
<text x="45" y="142" font-size="21" font-weight="800" fill="#2F6B45">① 画面は4つのタブ　─　すべて端末の中だけで動きます（圏外でも使えます）</text>

<g>
  <rect x="45" y="158" width="342" height="164" rx="10" fill="#FFFFFF" stroke="#D8E0D2" stroke-width="2"/>
  <path d="M55 158 h322 a10 10 0 0 1 10 10 v24 h-342 v-24 a10 10 0 0 1 10 -10 z" fill="#EDF5EE"/>
  <text x="62" y="184" font-size="18" font-weight="800" fill="#2F6B45">🧮 薬剤登録・希釈計算</text>
  <text x="62" y="218" font-size="15" fill="#3E5147">調合電卓：タンク1杯分の水量と薬量</text>
  <text x="62" y="242" font-size="15" fill="#3E5147">薬剤マスタ：名前・剤型・希釈倍率</text>
  <text x="62" y="266" font-size="15" fill="#3E5147">プリセット：よく使う組合せを保存</text>
  <text x="62" y="296" font-size="14" fill="#7A8A7C">農薬データを取り込むと、登録番号・</text>
  <text x="62" y="314" font-size="14" fill="#7A8A7C">名称・成分で検索できます</text>
</g>
<g>
  <rect x="430" y="158" width="342" height="164" rx="10" fill="#FFFFFF" stroke="#D8E0D2" stroke-width="2"/>
  <path d="M440 158 h322 a10 10 0 0 1 10 10 v24 h-342 v-24 a10 10 0 0 1 10 -10 z" fill="#EAF3FA"/>
  <text x="447" y="184" font-size="18" font-weight="800" fill="#2A5F80">🚁 作業予定・進捗確認</text>
  <text x="447" y="218" font-size="15" fill="#3E5147">作業一覧：その日の圃場・薬剤・実績</text>
  <text x="447" y="242" font-size="15" fill="#3E5147">進捗地図：進み具合を色で表示</text>
  <circle cx="456" cy="266" r="7" fill="#2F6B45"/><text x="470" y="272" font-size="14" fill="#3E5147">実施済</text>
  <circle cx="556" cy="266" r="7" fill="#C0392B"/><text x="570" y="272" font-size="14" fill="#3E5147">未実施</text>
  <circle cx="656" cy="266" r="7" fill="#9AA5A0"/><text x="670" y="272" font-size="14" fill="#3E5147">対象外</text>
  <text x="447" y="298" font-size="14" fill="#7A8A7C">開いている間は一定間隔で自動的に</text>
  <text x="447" y="316" font-size="14" fill="#7A8A7C">取り直します（既定30〜45秒）</text>
</g>
<g>
  <rect x="815" y="158" width="342" height="164" rx="10" fill="#FFFFFF" stroke="#D8E0D2" stroke-width="2"/>
  <path d="M825 158 h322 a10 10 0 0 1 10 10 v24 h-342 v-24 a10 10 0 0 1 10 -10 z" fill="#F5F0E4"/>
  <text x="832" y="184" font-size="18" font-weight="800" fill="#7A6414">🗺 圃場登録・圃場一覧</text>
  <text x="832" y="218" font-size="15" fill="#3E5147">地図：圃場を指で囲んで位置を登録</text>
  <text x="832" y="242" font-size="15" fill="#3E5147">囲んだ形から面積が自動で出ます</text>
  <text x="832" y="266" font-size="15" fill="#3E5147">圃場一覧：名前・作物・地区の編集</text>
  <text x="832" y="296" font-size="14" fill="#7A8A7C">線が交差した形は面積が小さく出るため</text>
  <text x="832" y="314" font-size="14" fill="#7A8A7C">警告が出ます（🔀並び順で直せます）</text>
</g>
<g>
  <rect x="1200" y="158" width="342" height="164" rx="10" fill="#FFFFFF" stroke="#D8E0D2" stroke-width="2"/>
  <path d="M1210 158 h322 a10 10 0 0 1 10 10 v24 h-342 v-24 a10 10 0 0 1 10 -10 z" fill="#F1EEF7"/>
  <text x="1217" y="184" font-size="18" font-weight="800" fill="#5B4B8A">⚙ 設定</text>
  <text x="1217" y="218" font-size="15" fill="#3E5147">送信・共有：URL・チームコード・合言葉</text>
  <text x="1217" y="242" font-size="15" fill="#3E5147">単位・作物マスタ・散布タンク容量</text>
  <text x="1217" y="266" font-size="15" fill="#3E5147">農薬データの取り込み／地図の設定</text>
  <text x="1217" y="296" font-size="14" fill="#7A8A7C">使い方ガイドとバージョン履歴も</text>
  <text x="1217" y="314" font-size="14" fill="#7A8A7C">ここで見られます</text>
</g>

<!-- ROW2 -->
<text x="45" y="368" font-size="21" font-weight="800" fill="#2F6B45">② チームで共有するしくみ　─　常時つないだ接続はありません。送るときだけ通信します</text>

<rect x="45" y="386" width="300" height="330" rx="12" fill="#FFFFFF" stroke="#2F6B45" stroke-width="2.5"/>
<path d="M57 386 h276 a12 12 0 0 1 12 12 v24 h-300 v-24 a12 12 0 0 1 12 -12 z" fill="#2F6B45"/>
<text x="195" y="413" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">📱 あなたの端末</text>
<text x="65" y="452" font-size="15" font-weight="700" fill="#2F6B45">端末の中に保存されるもの</text>
<rect x="65" y="464" width="260" height="74" rx="8" fill="#F1F5F2" stroke="#D8E0D2"/>
<text x="78" y="488" font-size="14" font-weight="700" fill="#3E5147">localStorage</text>
<text x="78" y="509" font-size="13" fill="#5B6B60">圃場・作業記録・薬剤・設定</text>
<text x="78" y="529" font-size="13" fill="#5B6B60">（アプリを消すまで残ります）</text>
<rect x="65" y="548" width="260" height="54" rx="8" fill="#F1F5F2" stroke="#D8E0D2"/>
<text x="78" y="572" font-size="14" font-weight="700" fill="#3E5147">IndexedDB</text>
<text x="78" y="593" font-size="13" fill="#5B6B60">農薬データ（約940KB）</text>
<rect x="65" y="612" width="260" height="42" rx="8" fill="#E6F2EA" stroke="#BFDDCB"/>
<text x="78" y="639" font-size="14" font-weight="700" fill="#1F6B43">📶 圏外でも記録できます</text>
<text x="65" y="678" font-size="13" fill="#5B6B60">電波が戻ると、未送信ぶんが自動で</text>
<text x="65" y="698" font-size="13" fill="#5B6B60">送られます（共有オンのとき）</text>

<rect x="1242" y="386" width="300" height="330" rx="12" fill="#FFFFFF" stroke="#2A5F80" stroke-width="2.5"/>
<path d="M1254 386 h276 a12 12 0 0 1 12 12 v24 h-300 v-24 a12 12 0 0 1 12 -12 z" fill="#2A5F80"/>
<text x="1392" y="413" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">📱📱 仲間の端末</text>
<text x="1262" y="452" font-size="15" font-weight="700" fill="#2A5F80">同じ「チームコード」の端末どうし</text>
<text x="1262" y="478" font-size="14" fill="#3E5147">だけがつながります。大文字と小文字</text>
<text x="1262" y="500" font-size="14" fill="#3E5147">は別のものとして扱われます。</text>
<rect x="1262" y="516" width="260" height="90" rx="8" fill="#EAF1F6" stroke="#C6DAE7"/>
<text x="1276" y="540" font-size="14" font-weight="700" fill="#2A5F80">受け取れるもの</text>
<text x="1276" y="563" font-size="13" fill="#3E5147">圃場（形・面積・作物・地区）</text>
<text x="1276" y="583" font-size="13" fill="#3E5147">薬剤マスタ</text>
<text x="1276" y="599" font-size="13" fill="#3E5147">その日の作業予定と進み具合</text>
<rect x="1262" y="616" width="260" height="66" rx="8" fill="#F6E4E0" stroke="#E7C3BA"/>
<text x="1276" y="640" font-size="14" font-weight="700" fill="#9A3B26">受け取らないもの</text>
<text x="1276" y="662" font-size="13" fill="#3E5147">実績の薬剤明細。進捗地図に要る</text>
<text x="1276" y="678" font-size="13" fill="#3E5147">要約だけを置いているためです</text>

<rect x="560" y="386" width="467" height="150" rx="12" fill="#FFFFFF" stroke="#5B4B8A" stroke-width="2.5"/>
<path d="M572 386 h443 a12 12 0 0 1 12 12 v24 h-467 v-24 a12 12 0 0 1 12 -12 z" fill="#5B4B8A"/>
<text x="793" y="413" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">☁ Google Apps Script（ウェブアプリ）</text>
<text x="580" y="452" font-size="14" fill="#3E5147">あなたが自分のGoogleアカウントに置く中継役です。</text>
<text x="580" y="474" font-size="14" fill="#3E5147">アプリの作者を含む第三者のサーバーは一切通りません。</text>
<rect x="580" y="488" width="200" height="36" rx="8" fill="#F1EEF7" stroke="#D6CEE9"/>
<text x="592" y="512" font-size="13" fill="#5B4B8A">🔑 チームコードで仕分け</text>
<rect x="796" y="488" width="211" height="36" rx="8" fill="#F1EEF7" stroke="#D6CEE9"/>
<text x="808" y="512" font-size="13" fill="#5B4B8A">🔐 共有パスワードで照合</text>

<rect x="490" y="576" width="607" height="152" rx="12" fill="#FFFFFF" stroke="#2F6B45" stroke-width="2.5"/>
<text x="510" y="606" font-size="18" font-weight="800" fill="#2F6B45">📊 Googleスプレッドシート（あなたの保管場所）</text>
<g font-size="13" fill="#2F6B45">
  <rect x="510" y="620" width="112" height="34" rx="7" fill="#EDF5EE" stroke="#BFDDCB"/><text x="566" y="642" text-anchor="middle">防除記録</text>
  <rect x="632" y="620" width="112" height="34" rx="7" fill="#EDF5EE" stroke="#BFDDCB"/><text x="688" y="642" text-anchor="middle">圃場マスタ</text>
  <rect x="754" y="620" width="112" height="34" rx="7" fill="#EDF5EE" stroke="#BFDDCB"/><text x="810" y="642" text-anchor="middle">作業</text>
  <rect x="876" y="620" width="112" height="34" rx="7" fill="#EDF5EE" stroke="#BFDDCB"/><text x="932" y="642" text-anchor="middle">薬剤マスタ</text>
  <rect x="998" y="620" width="89" height="34" rx="7" fill="#EDF5EE" stroke="#BFDDCB"/><text x="1042" y="642" text-anchor="middle">_共有データ</text>
</g>
<text x="510" y="676" font-size="13" fill="#5B6B60">「防除記録」が台帳です。「圃場マスタ／作業／薬剤マスタ」は端末間の</text>
<text x="510" y="696" font-size="13" fill="#5B6B60">受け渡しに使われ、シートは初回の送信で自動的に作られます。</text>
<text x="510" y="716" font-size="13" fill="#5B6B60">記録はここに貯まるので、あとから並べ替え・集計・印刷ができます。</text>

<line x1="345" y1="442" x2="552" y2="442" stroke="#3E5147" stroke-width="3" marker-end="url(#ar)"/>
<text x="448" y="432" font-size="14" font-weight="700" fill="#3E5147" text-anchor="middle">送る</text>
<text x="448" y="466" font-size="12" fill="#5B6B60" text-anchor="middle">圃場・薬剤・作業予定は</text>
<text x="448" y="482" font-size="12" fill="#5B6B60" text-anchor="middle">変えた1.5秒後に自動送信</text>
<line x1="552" y1="512" x2="345" y2="512" stroke="#2A5F80" stroke-width="3" marker-end="url(#arB)"/>
<text x="448" y="504" font-size="14" font-weight="700" fill="#2A5F80" text-anchor="middle">受け取る</text>
<text x="448" y="534" font-size="12" fill="#5B6B60" text-anchor="middle">起動時・タブを開いたとき・</text>
<text x="448" y="550" font-size="12" fill="#5B6B60" text-anchor="middle">開いている間は一定間隔で</text>

<line x1="1035" y1="442" x2="1234" y2="442" stroke="#3E5147" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1234" y1="512" x2="1035" y2="512" stroke="#2A5F80" stroke-width="3" marker-end="url(#arB)"/>
<text x="1134" y="432" font-size="14" font-weight="700" fill="#3E5147" text-anchor="middle">受け取る</text>
<text x="1134" y="504" font-size="14" font-weight="700" fill="#2A5F80" text-anchor="middle">送る</text>
<text x="1134" y="540" font-size="12" fill="#5B6B60" text-anchor="middle">向きは端末Aと同じです</text>

<line x1="778" y1="538" x2="778" y2="570" stroke="#3E5147" stroke-width="3" marker-end="url(#ar)"/>
<line x1="810" y1="570" x2="810" y2="538" stroke="#2A5F80" stroke-width="3" marker-end="url(#arB)"/>

<!-- ROW3 -->
<text x="45" y="766" font-size="21" font-weight="800" fill="#2F6B45">③ 外から取ってくるもの・送らないもの・止め方</text>

<rect x="45" y="782" width="480" height="300" rx="12" fill="#FFFFFF" stroke="#D8E0D2" stroke-width="2"/>
<path d="M57 782 h456 a12 12 0 0 1 12 12 v24 h-480 v-24 a12 12 0 0 1 12 -12 z" fill="#F5F0E4"/>
<text x="63" y="809" font-size="17" font-weight="800" fill="#7A6414">🌐 外から取ってくるもの（電波が要る部分）</text>
<line x1="66" y1="848" x2="66" y2="1046" stroke="#E2D8A9" stroke-width="3"/>
<circle cx="66" cy="852" r="6" fill="#7A6414"/>
<text x="84" y="857" font-size="15" font-weight="700" fill="#3E5147">地図（無料）国土地理院タイル</text>
<text x="84" y="878" font-size="13" fill="#5B6B60">標準地図・写真。APIキーは要りません</text>
<circle cx="66" cy="908" r="6" fill="#7A6414"/>
<text x="84" y="913" font-size="15" font-weight="700" fill="#3E5147">地図（任意）Googleマップ</text>
<text x="84" y="934" font-size="13" fill="#5B6B60">⚙設定でAPIキーを入れたときだけ使います。さらに</text>
<text x="84" y="952" font-size="13" fill="#5B6B60">マップID（ベクター）を入れると指で回せます</text>
<circle cx="66" cy="982" r="6" fill="#7A6414"/>
<text x="84" y="987" font-size="15" font-weight="700" fill="#3E5147">住所検索　国土地理院 住所検索API</text>
<text x="84" y="1008" font-size="13" fill="#5B6B60">地図で場所を探すときだけ呼びます</text>
<circle cx="66" cy="1038" r="6" fill="#7A6414"/>
<text x="84" y="1043" font-size="15" font-weight="700" fill="#3E5147">農薬データ　自分のGoogleドライブから</text>
<text x="84" y="1064" font-size="13" fill="#5B6B60">自分のApps Script経由で端末へ（1回取り込めば圏外で検索可）</text>

<rect x="555" y="782" width="480" height="300" rx="12" fill="#FFFFFF" stroke="#D8E0D2" stroke-width="2"/>
<path d="M567 782 h456 a12 12 0 0 1 12 12 v24 h-480 v-24 a12 12 0 0 1 12 -12 z" fill="#E6F2EA"/>
<text x="573" y="809" font-size="17" font-weight="800" fill="#1F6B43">🔀 共有のオン・オフ（画面右上のボタン）</text>
<rect x="575" y="838" width="180" height="42" rx="21" fill="#F1F5F2" stroke="#D8E0D2" stroke-width="2"/>
<text x="665" y="866" font-size="17" font-weight="800" fill="#3E5147" text-anchor="middle">☁ 共有オン</text>
<text x="778" y="868" font-size="22" fill="#5B6B60" text-anchor="middle">⇄</text>
<rect x="805" y="838" width="180" height="42" rx="21" fill="#F6E4E0" stroke="#E7C3BA" stroke-width="2"/>
<text x="895" y="866" font-size="17" font-weight="800" fill="#9A3B26" text-anchor="middle">🚫 共有オフ</text>
<text x="575" y="912" font-size="14" font-weight="800" fill="#3E5147">オフの間は、この端末は送りも受け取りもしません。</text>
<text x="575" y="936" font-size="14" fill="#3E5147">記録は今までどおり端末に残ります。</text>
<text x="575" y="962" font-size="14" fill="#3E5147">オンに戻すと、たまっていた未送信ぶんを自動で送り、</text>
<text x="575" y="984" font-size="14" fill="#3E5147">最新を取り直します。</text>
<rect x="575" y="1000" width="440" height="62" rx="8" fill="#F1F5F2" stroke="#D8E0D2"/>
<text x="590" y="1024" font-size="13" font-weight="700" fill="#3E5147">アプリを閉じても「切断」されません</text>
<text x="590" y="1046" font-size="13" fill="#5B6B60">常時つないだ接続が無く、送るときだけ通信するためです</text>

<rect x="1065" y="782" width="477" height="300" rx="12" fill="#FFFFFF" stroke="#D8E0D2" stroke-width="2"/>
<path d="M1077 782 h453 a12 12 0 0 1 12 12 v24 h-477 v-24 a12 12 0 0 1 12 -12 z" fill="#F6E4E0"/>
<text x="1083" y="809" font-size="17" font-weight="800" fill="#9A3B26">🔒 送るもの・送らないもの</text>
<text x="1085" y="842" font-size="14" font-weight="800" fill="#2F6B45">送られるもの</text>
<text x="1085" y="864" font-size="13" fill="#3E5147">圃場名／作物／面積／圃場の位置（囲んだ緯度経度）</text>
<text x="1085" y="884" font-size="13" fill="#3E5147">地区／薬剤／作業記録／記録者名／端末ID</text>
<text x="1085" y="906" font-size="12" fill="#7A8A7C">端末IDは初回起動時に作られる意味のない文字列で、</text>
<text x="1085" y="922" font-size="12" fill="#7A8A7C">機種や電話番号とは無関係です。</text>
<text x="1085" y="952" font-size="14" font-weight="800" fill="#9A3B26">送られないもの</text>
<text x="1085" y="976" font-size="13" fill="#3E5147">作業者の現在地（GPSの居場所）は送りません。</text>
<rect x="1085" y="992" width="437" height="70" rx="8" fill="#F6E4E0" stroke="#E7C3BA"/>
<text x="1100" y="1016" font-size="13" font-weight="700" fill="#9A3B26">⚠ 送信先は「全員がアクセスできる」で公開する設定です</text>
<text x="1100" y="1038" font-size="12" fill="#3E5147">共有パスワード（GASのSHARED_SECRET）を設定してください。未設定だと</text>
<text x="1100" y="1055" font-size="12" fill="#3E5147">URLを知っている人なら誰でも書き込めます。</text>

<text x="1542" y="1108" font-size="12" fill="#9AA5A0" text-anchor="end">農薬の登録内容は変わります。使用前に必ず容器のラベルを確認してください。</text>
</svg>
